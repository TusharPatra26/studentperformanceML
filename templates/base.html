<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f9ff">
    <title>{% block title %}EduPredict{% endblock %} | EduPredict</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('index') }}" aria-label="EduPredict home">
            <span>EduPredict</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
            <a class="{{ 'active' if request.endpoint == 'index' else '' }}" href="{{ url_for('index') }}">Home</a>
            <a class="{{ 'active' if request.endpoint == 'predict_datapoint' else '' }}" href="{{ url_for('predict_datapoint') }}">Predict</a>
            <a class="{{ 'active' if request.endpoint == 'about' else '' }}" href="{{ url_for('about') }}">About</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <span>Learn. Build. Make an impact.</span>
        <span>Student performance, understood.</span>
    </footer>
</body>
</html>
